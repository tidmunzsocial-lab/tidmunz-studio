<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tidmunz ติดตามโปรเจกต์</title>
<style>
:root{font:13px system-ui,"Segoe UI",sans-serif;color:#e8edf6;background:#111827}
body{width:370px;margin:0;padding:18px;box-sizing:border-box}
h1{font-size:17px;margin:0 0 4px}h2{font-size:13px;margin:15px 0 8px}
p{line-height:1.5;color:#abb7c9;margin:5px 0 12px}
small{color:#9dadc2}label{display:block;margin:12px 0 6px;font-weight:600}
input,select{width:100%;box-sizing:border-box;background:#222e42;border:1px solid #41506b;
 border-radius:7px;color:#f5f7ff;padding:10px;font:inherit}
input:focus,select:focus{outline:2px solid #6ba5ff}
button{font:inherit;border:1px solid #40516d;background:#27344c;color:white;
 border-radius:7px;padding:9px 12px;cursor:pointer}
button.primary{background:#356ad4;border-color:#356ad4}
button:disabled{opacity:.45;cursor:default}
.actions{display:flex;gap:7px;margin-top:12px}
.actions>*{flex:1}
.status{border:1px solid #3d4d65;border-radius:8px;padding:11px;background:#1a2638}
.line{display:flex;justify-content:space-between;gap:12px;margin:5px 0}
.line span{color:#a4b4cd}
.progress{background:#35425a;border-radius:8px;height:7px;overflow:hidden;margin:8px 0}
.progress>div{background:#6b9cf9;height:100%;width:0%}
#notice{min-height:22px;font-size:12px;line-height:1.55;margin-top:10px;white-space:normal}
#notice.error{color:#ffbdba}#notice.good{color:#8bdcb3}
footer{font-size:11px;color:#91a1ba;line-height:1.5;margin-top:12px}
</style></head><body>
<h1>ติดตามวิดีโอออโต้</h1>
<p>ส่งข้อความติดตามเข้าแชทโปรเจกต์ผ่าน Chrome ของ Tidmunz Studio จนกว่าจะได้วิดีโอรวม</p>
<section class="status">
 <div class="line"><span>เครื่อง</span><strong id="host">—</strong></div>
 <div class="line"><span>ภาพแรก</span><strong id="images">—</strong></div>
 <div class="line"><span>คลิป</span><strong id="clips">—</strong></div>
 <div class="progress"><div id="bar"></div></div>
 <div class="line"><span>โปรแกรม</span><strong id="stage">—</strong></div>
 <div class="line"><span>ติดตามแชท</span><strong id="follow">ยังไม่ตั้งค่า</strong></div>
 <div class="line"><span>รอบถัดไป</span><strong id="next">—</strong></div>
</section>
<label for="chatUrl">ลิงก์แชท ChatGPT ของโปรเจกต์นี้</label>
<input id="chatUrl" type="url" placeholder="https://chatgpt.com/c/...">
<label for="openTabs">หรือเลือกแชทที่เปิดใน Chrome ของโปรแกรม</label>
<select id="openTabs"><option value="">— เลือกแชท —</option></select>
<div class="actions">
 <button class="primary" id="start">เปิดติดตาม</button>
 <button id="stop">หยุด</button>
 <button id="now">ติดตามตอนนี้</button>
</div>
<div class="actions"><button id="refresh">รีเฟรชสถานะ</button><button id="verify">ตรวจข้อความค้าง</button><button id="diag">ตรวจช่องส่ง</button></div>
<div id="notice" role="status"></div>
<footer>ปรับรอบ 5–30 นาทีตามงานจริง • ไม่สร้างงานวิดีโอซ้ำ • หากยืนยันการส่งข้อความไม่ได้ ระบบจะหยุดอัตโนมัติ</footer>
<script src="followup_popup.js"></script>
</body></html>
